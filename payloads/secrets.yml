# payloads/secrets.yml
# Unified, high-fidelity regex patterns for modern API keys, tokens, and secrets

patterns:
  - name: "AWS Secret Key"
    regex: '(?i)aws_secret_access_key.{0,20}[=:''"]\s{0,5}[a-zA-Z0-9/+=]{40}'
    severity: "CRITICAL"
  - name: "GitHub Personal Access Token"
    regex: 'ghp_[0-9a-zA-Z]{36}'
    severity: "CRITICAL"
  - name: "GitHub OAuth Token"
    regex: 'gho_[0-9a-zA-Z]{36}'
    severity: "HIGH"
  - name: "Google API Key"
    regex: 'AIza[0-9A-Za-z\-_]{35}'
    severity: "MEDIUM"
  - name: "Google OAuth Access Token"
    regex: 'ya29\.[0-9A-Za-z\-_]+'
    severity: "HIGH"
  - name: "Stripe Standard Key"
    regex: 'sk_live_[0-9a-zA-Z]{24,}'
    severity: "CRITICAL"
  - name: "Stripe Restricted Key"
    regex: 'rk_live_[0-9a-zA-Z]{24,}'
    severity: "HIGH"
  - name: "Slack Bot Token"
    regex: 'xoxb-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}'
    severity: "CRITICAL"
  - name: "Slack User Token"
    regex: 'xoxp-[0-9]{10,13}-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{32}'
    severity: "CRITICAL"
  - name: "Slack Webhook"
    regex: 'https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8}/B[a-zA-Z0-9_]{8}/[a-zA-Z0-9_]{24}'
    severity: "HIGH"
  - name: "RSA Private Key"
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    severity: "CRITICAL"
  - name: "JWT Token"
    regex: 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+'
    severity: "MEDIUM"
  - name: "SendGrid API Key"
    regex: 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
    severity: "CRITICAL"
  - name: "Twilio API Key"
    regex: 'SK[0-9a-fA-F]{32}'
    severity: "HIGH"
  - name: "OpenAI API Key"
    regex: 'sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}'
    severity: "CRITICAL"
  - name: "Anthropic API Key"
    regex: 'sk-ant-api03-[A-Za-z0-9\-_]{90,}'
    severity: "CRITICAL"
  - name: "Database URI"
    regex: '(?:postgres|mysql|mongodb|redis|amqp)://[^\s"''<>]{10,}'
    severity: "CRITICAL"
